  - name: "Flatcar"
    vendor: "Kinvolk"
    default_login: "core"
    image_description: ""
    min_disk: 10
    releases:
      - name: "stable"
        codename: "none"
        baseURL: "https://stable.release.flatcar-linux.net/amd64-usr"
        releasepath: "current"
        image:
          distro: "flatcar"
          version: "prodution"
          usage: "openstack_image"
          extension: "img.gz"
        checksum:
          filename: "flatcar_production_openstack_image.img.gz.DIGESTS"
          algorithm: "sha512"

  - name: "Fedora"
    vendor: "Fedora Project"
    image_description: ""
    min_disk: 4
    releases:
      - name: '^(\d+).*?$'
        codename: "none"
        baseURL: "https://ftp.plusline.net/fedora/linux/releases/"
        releasepath: "Cloud/x86_64/images"
        image:
          distro: "Fedora"
          version: "latest"
          usage: "Cloud-Base-Generic"
          arch: "x86_64"
          extension: "qcow2"
        checksum:
          filesearch: true
          filename: ".*?CHECKSUM$"
          algorithm: "sha256"
