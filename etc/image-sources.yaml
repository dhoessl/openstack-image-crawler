          algorithm: "sha512"

  - name: "AlmaLinux"
    vendor: "AlmaLinux OS"
    image_description: ""
    releases:
      - name: '8'
        codename: "none"
        baseURL: "https://repo.almalinux.org/almalinux/8/"
        releasepath: "cloud/x86_64/images"
        image:
          distro: "AlmaLinux"
          version: '8'
          usage: "GenericCloud"
          arch: "x86_64"
          extension: "qcow2"
        # imagename: AlmaLinux-8-GenericCloud-latest.x86_64
        checksum:
          filename: "CHECKSUM"
          algorithm: "sha256"
        limit: 1
      - name: '9'
        codename: "none"
        baseURL: "https://repo.almalinux.org/almalinux/9/"
        releasepath: "cloud/x86_64/images"
