---
sources:
  - name: "Ubuntu"
    vendor: "Canonical Ltd."
    image_description: ""
    min_disk: 
    releases:
      - name: "22.04"
        codename: "jammy"
        baseURL: "https://cloud-images.ubuntu.com/releases/jammy/"
        releasepath: "release"
        image:
          distro: "ubuntu"
          version: "22.04"
          usage: "server-cloudimg"
          arch: "amd64"
          extension: "img"
        checksum:
          filename: "SHA256SUMS"
          algorithm: "sha256"
      - name: "24.04"
        codename: "noble"
        baseURL: "https://cloud-images.ubuntu.com/releases/noble/"
        releasepath: "release"
        image:
          distro: "ubuntu"
          version: "24.04"
          usage: "server-cloudimg"
          arch: "amd64"
          extension: "img"
        checksum:
          filename: "SHA256SUMS"
          algorithm: "sha256"

  - name: "Ubuntu Minimal"
