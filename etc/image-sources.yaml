  - name: "Debian"
    vendor: "Debian Community"
    image_description: ""
    releases:
      - name: "11"
        codename: "bullseye"
        baseURL: "https://cloud.debian.org/images/cloud/bullseye/"
        releasepath: "latest"
        image:
          distro: "debian"
          version: "11"
          usage: "genericcloud"
          arch: "amd64"
          extension: "qcow2"
        checksum:
          filename: "SHA512SUMS"
          algorithm: "sha512"
      - name: "12"
        codename: "bookworm"
        baseURL: "https://cloud.debian.org/images/cloud/bookworm/"
        releasepath: "latest"
        image:
          distro: "debian"
          version: "12"
          usage: "genericcloud"
